name: Maester Daily Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  maester:
    name: Run Maester checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Maester tests
        id: maester
        uses: maester365/maester-action@main
        with:
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          include_public_tests: true
          include_private_tests: false
          include_exchange: false
          include_teams: false
          include_sharepoint: false
          include_azure: false
          include_defender: false
          maester_version: latest
          disable_telemetry: false
          step_summary: true

      - name: Upload Maester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maester-test-results
          path: |
            ./**/*.html
            ./**/*.json
          if-no-files-found: warn
